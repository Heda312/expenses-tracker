<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Masuk · {{ app_name }}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="login-wrap">
  <div class="card login-card">
    <div class="login-head">
      <span class="brand-mark"></span>
      <div>
        <h1>Masuk</h1>
        <p class="muted">Catat pengeluaran dari struk dan pesan.</p>
      </div>
    </div>

    {% set flash_key = request.query_params.get('flash') %}
    {% if flash_key and flash_key in flash_messages %}
      {% set flash_kind, flash_text = flash_messages[flash_key] %}
      <div class="flash {{ flash_kind }}">{{ flash_text }}</div>
    {% endif %}

    <form method="post" action="/login" class="form-grid">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" value="{{ email }}" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Masuk</button>
    </form>
  </div>
</div>
</body>
</html>
