<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>Buat Akun · {{ app_name }}</title><link rel="icon" href="/static/favicon.svg"><link rel="stylesheet" href="/static/app.css"></head>
<body><div class="login-wrap"><div class="card login-card"><div class="login-head"><span class="brand-mark">H</span><div><h1>Buat akun</h1><p class="muted">Buat akun pertama untuk mulai memakai {{ app_name }}.</p></div></div>
{% set flash_key = request.query_params.get('flash') %}{% if flash_key and flash_key in flash_messages %}{% set flash_kind, flash_text = flash_messages[flash_key] %}<div class="flash {{ flash_kind }}">{{ flash_text }}</div>{% endif %}
<form method="post" action="/setup" class="form-grid"><div class="field"><label for="username">Username</label><input id="username" name="username" type="text" minlength="3" maxlength="80" autocomplete="username" required autofocus></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" minlength="12" autocomplete="new-password" required><span class="hint">Minimal 12 karakter.</span></div><button class="btn btn-primary btn-block" type="submit">Buat akun</button></form></div></div></body></html>
